# KM 密钥管理软件配置文件
# 格式：key=value（# 开头为注释）
# 说明：所有路径均可通过同名环境变量覆盖，便于本机开发测试
#       （环境变量优先级高于本文件）
# 环境：本文件默认值对应单板模拟环境（KM_ENV=SIM_WINDOWS/SIM_LINUX）；
#       正式隔离架构环境（KM_ENV=BOARD）构建时请将 comm_path 改为 formal。

[general]
# 心跳上报周期（秒）
heartbeat_interval=30
# 日志级别：info / warn / error（默认 error，即最高级，仅记录 error）
log_level=error

[selftest]
# 是否开启定时自检：on/off/1/0（默认 on）
# 开启后按 selftest_interval 周期执行密码卡算法自检与 FPGA 自检；
# 自检失败立即停止业务工作并上报管理服务，恢复后自动继续工作
selftest_enable=on
# 定时自检周期（秒），默认 3600（1 小时）；0 表示不周期自检（仅启动自检）
selftest_interval=3600

[paths]
# 运维日志目录
oplog_dir=/var/log/km/operational
# 审计日志目录（持久化队列）
audit_dir=/var/log/km/audit
# 密钥存储目录
key_dir=/opt/km/keys
# 证书存储目录
cert_dir=/opt/km/certs

[crypto]
# 密码服务 Provider：soft（第一阶段纯软）/ pcie（第二阶段密码卡）
provider=soft
# 主密钥环境变量名（主密钥不落地，经环境变量注入）
master_key_env=KM_MASTER_KEY

[comm]
# 管理通路类型：formal（正式通路）/ simulation（模拟通路）
# 必须与编译环境 KM_ENV 匹配，否则启动时被拒绝（KM_ERR_NOT_SUPPORTED）：
#   KM_ENV_BOARD        -> formal（自定义协议 + GMAC 通道经 FPGA 转发内网 D3000M）
#   KM_ENV_SIM_WINDOWS / KM_ENV_SIM_LINUX -> simulation（消息队列模拟，无需 FPGA/GMAC）
comm_path=simulation
# GMAC 通信模式：loopback（第一阶段回环桩）/ raw（第二阶段 AF_PACKET）
gmac_mode=loopback

[oplog]
# 是否打印运维日志到后台（stdout/stderr）：0=否 1=是（默认 1）
log_console=1
# 是否记录运维日志到文件：0=否 1=是
log_to_file=1
# 单个日志文件最大字节数（0=不限制；超过后轮转）
log_file_max=0
# 保留的历史日志文件数（循环覆盖，>=1）
log_file_count=5
